# Controlled config for poc.py --rce-det. A single worker and fixed buffers make
# the heap layout reproducible, so the offsets in poc.py (PL_OFF, HEAP_PAGE_OFF)
# hold. A stock deploy is not this predictable; use --rce there. The backend
# (127.0.0.1:19999) need not exist.
#   mkdir -p logs; /path/to/nginx -c nginx_det.conf -p .

worker_processes  1;
master_process    off;
error_log         /logs/error.log crit;
pid               /logs/nginx.pid;

events { worker_connections 1024; }

http {
    access_log off;
    client_body_buffer_size       64k;
    client_body_in_single_buffer  on;

    map $request_body $bodyvar { "~^(.{100,})$" mapped; default nomatch; }
    map $http_x_lk   $lv2      { "~^(.)$"       "";     default ""; }

    server {
        listen  127.0.0.1:8950;

        location = / { return 200 "alive\n"; }
        location /   { return 200 "ok\n"; }                  # victims
        location ~ "^/l2/(.+)$" { return 200 "$1$lv2\n"; }   # leak

        location ~ "^/b/(.{1,3})$" {                         # trigger + payload holder
            proxy_method  "$1=$bodyvar=$1";
            proxy_pass    http://127.0.0.1:19999;
        }
    }
}
